<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#gradient)"/>
  
  <!-- Logo/Icon -->
  <g transform="translate(450, 150)">
    <rect x="0" y="0" width="300" height="50" rx="8" fill="#0066cc" opacity="0.9"/>
    <rect x="0" y="70" width="225" height="50" rx="8" fill="#0066cc" opacity="0.7"/>
    <rect x="0" y="140" width="150" height="50" rx="8" fill="#0066cc" opacity="0.5"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#0f172a" text-anchor="middle">
    TenantShare
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="32" fill="#475569" text-anchor="middle">
    Allocate building energy to tenants
  </text>
  
  <!-- Bottom text -->
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="28" fill="#64748b" text-anchor="middle">
    50% • 30% • 20%
  </text>
  
  <!-- Footer -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">
    Client-side • Privacy-first • GHG Protocol compliant
  </text>
</svg>
